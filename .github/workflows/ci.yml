name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container: ghcr.io/pranavasri-rm/scrna-analysis:1.0   # the same image the pipeline uses
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pytest
        run: pip install pytest==9.1.1

      - name: Run unit tests
        run: pytest -v tests/
        
  pipeline-stub:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java (Nextflow needs it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.3"

      - name: Stub run of the whole pipeline
        run: nextflow run main.nf -stub -profile test