name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container: ghcr.io/pranavasri-rm/scrna-analysis:1.0   # the same image the pipeline uses
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pytest
        run: pip install pytest==9.1.1

      - name: Run unit tests
        run: pytest -v tests/